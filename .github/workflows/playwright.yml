name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env_type: [stage, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-e2e .

      - name: Run Playwright tests (${{ matrix.env_type }})
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            -e ENV=${{ matrix.env_type }} \
            playwright-e2e

      - name: Upload Playwright report & artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.env_type }}
          path: |
            playwright-report/
            test-results/
            trace/
          retention-days: 30